name: Main update check
run-name: "PR #${{ github.event.number }} check (${{ github.sha }})"

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
    - name: set up go 1.x
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    - name: checkout
      uses: actions/checkout@v4
    - name: check gofmt
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted:"
          echo "$unformatted"
          exit 1
        fi
    - name: vet
      run: go vet ./...

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.25 is the floor declared in go.mod, 1.26 is the current release.
        go: ['1.25', '1.26']
    steps:
    - name: set up go 1.x
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - name: setup tparse
      run: go install github.com/mfridman/tparse@v0.18.0
    - name: checkout
      uses: actions/checkout@v4
    - name: build
      run: go build -v ./...

    - name: test
      run: |
        set -o pipefail
        go test -json ./... | tparse -all
